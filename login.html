<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido | NutriVida</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/estilos.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0a0a0a; /* Fondo oscuro premium */
            font-family: 'Inter', sans-serif;
        }
        .login-box {
            background-color: #ffffff;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            border: 2px solid #000;
            box-shadow: 8px 8px 0px #ffffff; /* Sombra sólida invertida */
        }
        .login-box h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
            margin-top: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ccc;
            outline: none;
            border-radius: 0;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus {
            border-color: #000;
            border-width: 2px;
        }
        .btn-full {
            display: block;
            width: 100%;
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 1rem;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-full:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>NutriVida.</h1>
        <p style="color: #666; font-size: 0.9rem;">Portal Administrativo y Clínico</p>

        <div class="form-group">
            <label>Usuario / RUT</label>
            <input type="text" placeholder="Ej: 12.345.678-9">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" placeholder="••••••••">
        </div>

        <!-- Este botón simula el inicio de sesión exitoso y te lleva al panel -->
        <a href="./admin.html" class="btn-full">Ingresar al Sistema</a>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="./index.html" style="color: #666; font-size: 0.8rem; text-decoration: none;">← Volver al sitio público</a>
        </div>
    </div>

</body>
</html>
